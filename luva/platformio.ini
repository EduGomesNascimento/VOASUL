; Luva de gestos VoaSul (XIAO ESP32-S3 + 1 MPU-6050).
;   pio run -e xiao -t upload     grava
;   pio device monitor            mostra a orientacao da mao e o comando enviado
[env:xiao]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
build_flags   = -O2 -Wall -fsingle-precision-constant
