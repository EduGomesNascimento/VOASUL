; Luva de gestos VoaSul (1 MPU-6050). Escolha a placa:
;   pio run -e c3 -t upload       ESP32-C3 Super Mini (padrao, a mais barata)
;   pio run -e c6 -t upload       ESP32-C6 Super Mini
;   pio run -e xiao -t upload     XIAO ESP32-S3
;   pio device monitor            mostra a orientacao da mao e o comando enviado
[platformio]
default_envs = c3

[common]
build_flags = -O2 -Wall -fsingle-precision-constant

; ESP32-C3 Super Mini: SDA 6, SCL 7, BOOT 9, LED 8 (acende com LOW). Serial pela USB-C.
[env:c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
                -DPIN_SDA=6 -DPIN_SCL=7 -DPIN_BOTAO=9 -DPIN_LED=8 -DLED_LIGA=LOW

; ESP32-C6 Super Mini: SDA 6, SCL 7, BOOT 9, LED 15 (acende com HIGH). Serial pela USB-C.
[env:c6]
platform      = espressif32
board         = esp32-c6-devkitc-1
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
                -DPIN_SDA=6 -DPIN_SCL=7 -DPIN_BOTAO=9 -DPIN_LED=15 -DLED_LIGA=HIGH

; XIAO ESP32-S3 (ou Sense): SDA D4 (5), SCL D5 (6), BOOT 0, LED 21 (acende com LOW).
[env:xiao]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags} -DPIN_SDA=5 -DPIN_SCL=6 -DPIN_BOTAO=0 -DPIN_LED=21 -DLED_LIGA=LOW
