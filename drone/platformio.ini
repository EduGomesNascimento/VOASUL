; Duas placas, um unico codigo. Escolha com:  pio run -e picow  /  -e esp32dev
;
; Nao ha lib_deps: os drivers de sensor falam direto com os registradores e o
; servidor WebSocket e proprio (src/websocket.cpp). Isso evita depender de
; bibliotecas cujo suporte a RP2040 varia de versao para versao.

[common]
build_flags =
    -O2
    -Wall
    ; O loop de voo trabalha em float. Sem isto o compilador promove as
    ; constantes a double, e nem RP2040 nem ESP32 tem dupla precisao em
    ; hardware (custa dezenas de vezes mais ciclos).
    -fsingle-precision-constant

; ---------------------------------------------------------------- Pico W
[env:picow]
platform      = https://github.com/maxgerhardt/platform-raspberrypi.git
board         = rpipicow
framework     = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags   = ${common.build_flags}
build_src_filter = +<*> -<terra/>

; ---------------------------------------------------------------- ESP32
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = ${common.build_flags}
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<terra/>

; ---------------------------------------------------------------- ESTACAO TERRA
; ESP32-C3 Super Mini na capinha do celular: Wi-Fi para o celular, ESP-NOW para o drone.
;   pio run -e terra -t upload
[env:terra]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<terra/> +<websocket.cpp> +<sha1.cpp>
